name: HKID Appointment Monitor

on:
  # 不再使用 GitHub 自带 schedule
  # 定时任务完全交给 Cloudflare
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hkid-appointment-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    timeout-minutes: 2

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check quota
        env:

          # 只监测到 2026-09-30
          END_DATE: "2026-09-30"

          # 留空 = 全部六个办事处
          OFFICES: ""

          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_MODE: ${{ secrets.SMTP_MODE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}

        run: python monitor.py

      - name: Save monitor state
        shell: bash

        run: |

          if git diff --quiet -- state.json; then
            echo "预约状态没有变化。"
            echo "state.json 没有变化。"
            echo "本轮不产生 Git commit。"
            exit 0
          fi

          echo "预约状态发生变化，保存 state.json。"

          git config user.name "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          git commit \
          -m "chore: update HKID appointment state"

          git pull --rebase

          git push
